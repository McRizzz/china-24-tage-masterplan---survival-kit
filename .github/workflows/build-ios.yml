name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencies installieren & Web App bauen
        run: |
          npm install
          npm run build

      - name: Capacitor 6 Setup
        run: |
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/ios@^6.0.0
          npx cap init "China Reise" "com.chinareise.app" --web-dir "dist"
          npx cap add ios
          npx cap sync ios

      - name: iOS App kompilieren (Xcode Build)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: In .ipa Datei umwandeln
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r China-Reise-App.ipa Payload

      - name: IPA als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: China-Reise-App-IPA
          path: China-Reise-App.ipa
