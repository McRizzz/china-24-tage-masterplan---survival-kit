name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dependencies installieren & Web App bauen
        run: |
          npm install
          npm run build

      - name: Capacitor & iOS Pods komplett sauber einrichten
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest
          
          # Initialisierung mit Web-Dir
          npx cap init "China Reise" "com.chinareise.app" --web-dir "dist"
          
          # iOS hinzufügen ohne automatisches Pod-Install
          npx cap add ios || true
          
          # Podfile direkt auf iOS 15.0 erzwingen
          cat << 'EOF' > ios/App/Podfile
          platform :ios, '15.0'
          use_frameworks!

          # workaround to avoid Xcode caching of Pods that requires
          # git repo to have a branch or label
          def capacitor_pods
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end

          target 'App' do
            capacitor_pods
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              end
            end
          end
          EOF

          # CocoaPods mit frischem Trunk installieren
          cd ios/App
          pod repo update
          pod install
          cd ../..
          
          # Web-Assets in natives iOS-Projekt kopieren
          npx cap copy ios

      - name: iOS App kompilieren (Xcode Build)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: In .ipa Datei umwandeln
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r China-Reise-App.ipa Payload

      - name: IPA als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: China-Reise-App-IPA
          path: China-Reise-App.ipa
