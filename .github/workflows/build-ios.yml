name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dependencies installieren & App bauen
        run: |
          npm install
          npm run build

      - name: Capacitor iOS einrichten & Podfile anpassen
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "China Reise" "com.chinareise.app" --web-dir "dist"
          npx cap add ios
          
          # iOS Deployment Target im Podfile auf 14.0 anheben
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '14.0'/g" ios/App/Podfile || true
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '14.0'/g" ios/App/Podfile || true
          
          # CocoaPods Sync & Install durchführen
          cd ios/App && pod install --repo-update && cd ../..
          npx cap sync ios

      - name: iOS App kompilieren (.app erstellen)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: In .ipa Datei umwandeln
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r China-Reise-App.ipa Payload

      - name: IPA als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: China-Reise-App-IPA
          path: China-Reise-App.ipa
